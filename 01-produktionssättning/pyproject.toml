[project]
name = "iris-service"
version = "1.0.0"
description = "Från notebook till körbar tjänst: träna, servera och testa en Iris-modell"
readme = "README.md"
requires-python = ">=3.12"
# Pinna versioner! En modell sparad med joblib kan vägra laddas
# (eller ge fel resultat) om scikit-learn-versionen skiljer sig.
dependencies = [
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "numpy>=2.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "streamlit==1.63.0",
]

[project.scripts]
train = "iris_service.train:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # krävs av TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
