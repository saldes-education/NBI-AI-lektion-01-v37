[project]
name = "iris-mlflow"
version = "1.0.0"
description = "Från notebook till körbar tjänst: träna, registrera i MLflow, servera och testa en Iris-modell"
readme = "README.md"
requires-python = ">=3.12"
# Pinna versioner! Artefakten i registret bär med sig sina egna krav
# (se MLmodel / requirements.txt i mlruns), men API:ets miljö måste matcha.
dependencies = [
    "scikit-learn==1.8.0",
    "pandas>=2.0",
    "mlflow==3.16.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "streamlit==1.63.0",
]

[project.scripts]
train = "iris_mlflow.train:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # krävs av TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_mlflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
